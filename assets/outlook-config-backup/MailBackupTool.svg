<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#2E5A8B"/>
    </linearGradient>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8E8E8"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34C759"/>
      <stop offset="100%" style="stop-color:#248A3D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="64" y="64" width="100" height="100" rx="180" ry="180" fill="url(#bgGrad)"/>
  
  <!-- Envelope body -->
  <g filter="url(#shadow)">
    <rect x="180" y="320" width="500" height="380" rx="30" ry="30" fill="url(#envGrad)"/>
    
    <!-- Envelope flap -->
    <path d="M180 350 L430 520 L680 350" fill="none" stroke="#D0D0D0" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Envelope flap top -->
    <path d="M180 320 L180 350 L430 520 L680 350 L680 320 Z" fill="#F5F5F5" stroke="none"/>
    
    <!-- Envelope lines (mail content suggestion) -->
    <line x1="230" y1="580" x2="500" y2="580" stroke="#C0C0C0" stroke-width="12" stroke-linecap="round"/>
    <line x1="230" y1="630" x2="450" y2="630" stroke="#D5D5D5" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Circular arrow (backup/sync symbol) -->
  <g filter="url(#innerShadow)">
    <circle cx="700" cy="600" r="180" fill="url(#arrowGrad)"/>
    
    <!-- Circular arrow path -->
    <path d="M700 480 
             A120 120 0 1 1 580 600" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="36" 
          stroke-linecap="round"/>
    
    <!-- Arrow head -->
    <polygon points="580,520 580,680 480,600" fill="#FFFFFF"/>
    
    <!-- Small check mark inside -->
    <path d="M660 600 L690 640 L780 540" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="28" 
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
